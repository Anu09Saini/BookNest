<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Member Login | BookNest</title>
  <link rel="stylesheet" href="{{ url_for('static', path='/css/style.css') }}">
</head>

<body>
  <header class="navbar">
    <a href="/catalogue" class="brand">
      <span class="brand-icon">B</span> BookNest
    </a>
    <nav>
      <a href="/catalogue" class="nav-link">Catalogue</a>
      <a href="/members/register" class="nav-link">Create Account</a>
    </nav>
  </header>

  <main class="container">
    <section class="login-panel">
      <p class="eyebrow">WELCOME BACK</p>
      <h1>Member Login</h1>
      <p class="hero-description">
        Sign in to view your loans, due dates and library fines.
      </p>

      {% if error %}
      <div class="error-message">{{ error }}</div>
      {% endif %}
      {% if message %}
      <div class="success-message">{{ message }}</div>
      {% endif %}

      <form action="/members/login" method="post" class="member-form">
        <label for="email">Email address</label>
        <input id="email" type="email" name="email" autocomplete="email" required>

        <label for="password">Password</label>
        <input id="password" type="password" name="password" autocomplete="current-password" required>

        <button type="submit" class="form-button">Sign in</button>
      </form>

      <p class="form-note" style="text-align: center;">
        <a href="/members/register" class="nav-link">Create Account</a>
      </p>
      <p class="form-note" style="text-align: center;">
        Need to explore first? <a href="/catalogue">Browse the catalogue</a>
      </p>
    </section>
  </main>
</body>

</html>
