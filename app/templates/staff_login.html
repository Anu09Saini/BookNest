<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Librarian Login | BookNest</title>
  <link rel="stylesheet" href="{{ url_for('static', path='/css/style.css') }}">
</head>

<body>
  <header class="navbar">
    <a href="/catalogue" class="brand">
      <span class="brand-icon">B</span> BookNest
    </a>
    <nav><a href="/catalogue" class="nav-link">Public Catalogue</a></nav>
  </header>

  <main class="container">
    <section class="login-panel">
      <p class="eyebrow">LIBRARY STAFF PORTAL</p>
      <h1>Librarian Login</h1>
      <p class="hero-description">
        Sign in to manage checkouts, returns and library reports.
      </p>

      {% if error %}
      <div class="error-message">{{ error }}</div>
      {% endif %}

      <form action="/staff/login" method="post" class="member-form">
        <label for="email">Staff email</label>
        <input id="email" name="email" type="email" autocomplete="username" required>

        <label for="password">Password</label>
        <input id="password" name="password" type="password" autocomplete="current-password" required>

        <button type="submit" class="form-button">Sign in</button>
      </form>
    </section>
  </main>
</body>

</html>
